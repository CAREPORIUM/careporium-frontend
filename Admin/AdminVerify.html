<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careporium - Verify Your Sign-in</title>

    <!-- Tailwind CSS from the CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Use SF Pro (the Apple system font) for the whole page -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                '"SF Pro Text"',
                '"Segoe UI"',
                "Roboto",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-slate-50 text-gray-900">
    <!-- Everything in the middle of the screen -->
    <main
      class="min-h-screen flex flex-col items-center justify-center px-5 py-10"
    >
      <img
        src="/images/logo-blue.png"
        alt="Careporium logo"
        class="w-36 h-auto"
      />
      <h1 class="text-2xl font-semibold mt-3">Verify your sign-in</h1>
      <p class="text-xs text-gray-700 mt-3">
        Enter the code sent to your registered admin email.
      </p>

      <!-- White card -->
      <div
        class="w-full max-w-md bg-white border border-gray-200 rounded-2xl p-6 mt-5"
      >
        <h2 class="text-lg font-semibold">Security verification</h2>
        <p class="text-xs text-gray-700 mt-1">
          Code sent to a••••@careporium.com
        </p>

        <form id="codeForm" class="mt-3" novalidate>
          <label for="securityCode" class="block text-sm font-semibold mb-2"
            >6-digit verification code</label
          >
          <!-- inputmode="numeric" opens the number keyboard on phones -->
          <input
            type="text"
            id="securityCode"
            inputmode="numeric"
            maxlength="6"
            placeholder="Enter code"
            class="w-full border border-gray-200 rounded-lg py-3 px-3 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
          />
          <p
            id="securityCodeError"
            class="text-xs font-medium text-red-500 mt-1 hidden"
          ></p>

          <button
            type="submit"
            id="verifyButton"
            class="w-full bg-blue-600 text-white text-sm font-medium text-center py-3 rounded-lg hover:bg-blue-700 mt-3"
          >
            Verify and sign in
          </button>
        </form>

        <div class="text-center mt-3">
          <button
            type="button"
            id="resendCode"
            class="border border-blue-600 text-blue-600 text-sm font-medium text-center py-3 rounded-lg hover:bg-blue-50 px-8"
          >
            Resend code
          </button>
        </div>
        <!-- Shown after "Resend code" is clicked -->
        <p
          id="resendMessage"
          class="text-xs font-medium text-green-700 text-center mt-3 hidden"
        >
          A new code has been sent.
        </p>

        <p class="text-xs text-gray-700 text-center mt-3">
          Code expired? Request a new one. After repeated failed attempts,
          sign-in is temporarily blocked.
        </p>
      </div>
    </main>

    <!-- JavaScript for the two admin sign-in pages -->
    <script src="/js/AdminAuth.js"></script>
  </body>
</html>
