<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careporium - Notifications</title>

    <!-- Tailwind CSS from the CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Use SF Pro (the Apple system font) for the whole page -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                '"SF Pro Text"',
                '"Segoe UI"',
                "Roboto",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
  </head>

  <!-- data-account tells notifications.js whose notifications these are -->
  <body class="bg-slate-50 text-gray-900" data-account="facility">
    <!-- Sidebar on the left, page on the right -->
    <div class="flex min-h-screen">
      <!-- ==================== SIDEBAR ==================== -->
      <!-- Mobile: hidden until the menu button opens it, then it covers the left of the screen (fixed).
           Desktop (md:): always visible, and sticky + h-screen keeps it in place while the page scrolls. -->
      <aside
        id="sidebar"
        class="flex hidden md:flex flex-col fixed md:sticky inset-y-0 md:top-0 left-0 z-20 w-72 md:w-56 h-screen overflow-y-auto flex-shrink-0 bg-white border-r border-gray-200 p-5"
      >
        <!-- Logo, with a close button next to it (the close button only shows on mobile).
             gap-5 and the wider mobile sidebar (w-72) keep the button away from the logo. -->
        <div class="flex items-center justify-between gap-5">
          <img src="../images/logo-blue.png" alt="Careporium logo" class="w-36 h-auto" />
          <button type="button" id="closeMenuButton" class="md:hidden p-2 rounded-lg hover:bg-gray-100">
            <img src="../icons/close.png" alt="Close menu" class="w-6 h-6" />
          </button>
        </div>

        <!-- Menu links -->
        <nav class="space-y-2 mt-10">
          <a href="../FacilityHiringSection/Dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 text-sm font-medium hover:bg-gray-50">
            <img src="../icons/nav-dashboard.png" alt="" class="w-4 h-4" />
            Dashboard
          </a>
          <a href="../FacilityHiringSection/PostShift.html" data-needs-verification class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 text-sm font-medium hover:bg-gray-50">
            <img src="../icons/nav-post-shift.png" alt="" class="w-4 h-4" />
            Post a shift
          </a>
          <a href="../FacilityHiringSection/Applicants.html" data-needs-verification class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 text-sm font-medium hover:bg-gray-50">
            <img src="../icons/nav-applicants.png" alt="" class="w-4 h-4" />
            Applicants
          </a>
          <a href="../FacilityHiringSection/ManageShifts.html" data-needs-verification class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 text-sm font-medium hover:bg-gray-50">
            <img src="../icons/nav-upcoming.png" alt="" class="w-4 h-4" />
            Manage shifts
          </a>
          <a href="../FacilityHiringSection/Payments.html" data-needs-verification class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 text-sm font-medium hover:bg-gray-50">
            <img src="../icons/nav-payments.png" alt="" class="w-4 h-4" />
            Payments
          </a>
          <a href="../FacilityHiringSection/FacilityProfile.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 text-sm font-medium hover:bg-gray-50">
            <img src="../icons/nav-profile.png" alt="" class="w-4 h-4" />
            Facility profile
          </a>
          <!-- Active page: light blue -->
          <a href="../FacilityHiringSection/Notifications.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-blue-50 text-blue-600 text-sm font-medium">
            <img src="../icons/bell.png" alt="" class="w-4 h-4" />
            Notifications
          </a>
        </nav>

        <!-- Log out: outside the <nav>, so mt-auto can push it to the bottom-left of the sidebar -->
        <button
          type="button"
          id="logoutButton"
          data-login="../AuthenticationSection/login.html"
          class="mt-auto w-full flex items-center gap-3 px-3 py-2 rounded-lg border border-red-600 text-red-600 text-sm font-medium hover:bg-red-50"
        >
          <img src="../icons/logout.png" alt="" class="w-4 h-4" />
          Log out
        </button>
      </aside>

      <!-- ==================== RIGHT SIDE ==================== -->
      <div class="flex-1 min-w-0">
        <!-- Top bar. sticky top-0 keeps it at the top while the page scrolls under it. -->
        <header class="sticky top-0 z-10 bg-white border-b border-gray-200 px-5 md:px-8 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <!-- Menu button (only on mobile) -->
            <button type="button" id="menuButton" class="md:hidden">
              <img src="../icons/menu.png" alt="Open menu" class="w-6 h-6" />
            </button>
            <!-- No page title in the top bar in this design -->
            <span></span>
          </div>

          <div class="flex items-center gap-3">
            <!-- The bell opens the Notifications page -->
            <a href="../FacilityHiringSection/Notifications.html" class="p-1 rounded-lg hover:bg-gray-100"><img src="../icons/bell.png" alt="Notifications" class="w-4 h-4" /></a>
            <p class="hidden sm:block text-sm font-medium" data-user-name></p>
            <!-- Initials in a light blue circle -->
            <span class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 text-xs font-semibold flex items-center justify-center" data-user-initials></span>
          </div>
        </header>

        <!-- ==================== PAGE CONTENT ==================== -->
        <main class="p-5 md:p-8 max-w-6xl">
          <!-- Errors that don't belong to one input (e.g. "Can't reach the server") show here -->
          <p id="formError" class="hidden bg-red-50 text-red-600 text-xs font-medium rounded-lg p-3 mb-5"></p>

          <h1 class="text-3xl font-semibold">Notifications</h1>
          <p id="notificationsSubtitle" class="text-sm text-gray-700 mt-2">Keep up with applicants, staffing needs and completed shifts.</p>

          <!-- Tabs on the left, "Mark all as read" on the right. The JS updates the numbers. -->
          <div class="flex flex-wrap items-center justify-between gap-3 mt-5">
            <div class="flex gap-3">
              <button type="button" class="notification-tab w-40 border border-blue-600 text-blue-600 text-sm font-medium text-center py-3 rounded-lg bg-blue-50" data-tab="all">All · <span id="allCount">0</span></button>
              <button type="button" class="notification-tab w-40 border border-blue-600 text-blue-600 text-sm font-medium text-center py-3 rounded-lg bg-white" data-tab="unread">Unread · <span id="unreadCount">0</span></button>
            </div>
            <!-- Becomes "All caught up" (and can't be clicked) when nothing is unread -->
            <button type="button" id="markAllRead" class="w-40 bg-white border border-blue-600 text-blue-600 text-sm font-medium text-center py-3 rounded-lg hover:bg-blue-50">Mark all as read</button>
          </div>

          <!-- Shown before the account is verified (amber), or red if documents were rejected -->
          <div id="verificationNote" class="hidden bg-amber-50 border border-amber-100 rounded-xl p-5 mt-8">
            <p id="noteTitle" class="text-sm font-semibold"></p>
            <p id="noteText" class="text-xs text-gray-700 mt-1"></p>
          </div>

          <p id="notificationsLoading" class="text-sm text-gray-700 mt-8">Loading your notifications…</p>

          <!-- id="notificationList": the JS draws the notifications here, grouped by Today / Yesterday / Earlier -->
          <div id="notificationList"></div>

          <!-- Shown when there's nothing to show in the chosen tab -->
          <section id="notificationsEmpty" class="hidden bg-white border border-gray-200 rounded-2xl p-6 mt-8">
            <h2 class="text-lg font-semibold">You're all caught up</h2>
            <p class="text-xs text-gray-700 mt-2">You've read every update. New notifications will appear here.</p>
            <a id="backToDashboard" href="#" class="inline-block border border-blue-600 text-blue-600 text-sm font-medium text-center py-3 rounded-lg hover:bg-blue-50 px-10 mt-5">Back to dashboard</a>
          </section>
        </main>
      </div>
    </div>

    <!-- api.js must come first: the page script uses its settings and helpers -->
    <script src="../js/api.js"></script>
    <!-- backend.js translates between the pages and the backend's field names -->
    <script src="../js/backend.js"></script>
    <script src="../js/facilityDashboard.js"></script>
    <script src="../js/notifications.js"></script>
  </body>
</html>
