<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careporium - Forgot Password</title>

    <!-- Tailwind CSS from the CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Use SF Pro (the Apple system font) for the whole page -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                '"SF Pro Text"',
                '"Segoe UI"',
                "Roboto",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-slate-50 min-h-screen relative overflow-x-hidden">
    <!-- Soft blue circles in the background -->
    <div class="absolute top-20 left-10 w-72 h-72 bg-blue-100 rounded-full blur-3xl"></div>
    <div class="absolute bottom-10 right-10 w-80 h-80 bg-blue-100 rounded-full blur-3xl"></div>

    <!-- This puts the white card in the middle of the screen -->
    <main class="relative min-h-screen flex items-center justify-center px-5 py-10">
      <!-- White card (max-w-md controls how wide it can get) -->
      <div class="w-full max-w-md bg-white rounded-xl shadow-sm p-5 md:p-10">
        <!-- Back link: history.back() takes the user to the page they came from -->
        <button type="button" onclick="history.back()" class="text-xs font-medium text-blue-600">
          ← Back
        </button>

        <!-- Title (on the left) -->
        <h2 class="text-2xl font-semibold text-gray-900 mt-3">Forgot password?</h2>
        <p class="text-xs font-medium text-gray-700 mt-3">
          Enter the email linked to your account and we'll send you a 6-digit code to reset your password.
        </p>

        <!-- The form. "novalidate" turns off the browser's own popups so our JS messages show instead -->
        <form id="forgotForm" class="mt-10" novalidate>
          <label for="email" class="block text-sm font-semibold text-gray-900 mb-2">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="you@gmail.com"
            class="w-full border border-blue-400 rounded-lg py-3 px-3 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
          />
          <!-- Error message (hidden until there is a mistake) -->
          <p id="emailError" class="text-xs font-medium text-red-500 mt-1 hidden"></p>

          <!-- Send code button -->
          <button type="submit" class="w-full bg-blue-600 text-white text-sm font-semibold py-3 rounded-lg mt-5 hover:bg-blue-700">
            Send code
          </button>
        </form>

        <!-- Back to login link (on the left) -->
        <a href="../AuthenticationSection/login.html" class="inline-block text-xs font-medium text-blue-600 mt-10">
          Back to login
        </a>
      </div>
    </main>

    <!-- api.js must come first: the page script uses its settings and helpers -->
    <script src="../js/api.js"></script>
    <!-- backend.js translates between the pages and the backend's field names -->
    <script src="../js/backend.js"></script>
    <script src="../js/forgotPassword.js"></script>
  </body>
</html>
