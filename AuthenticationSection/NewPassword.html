<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careporium - Create New Password</title>

    <!-- Tailwind CSS from the CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Use SF Pro (the Apple system font) for the whole page -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                '"SF Pro Text"',
                '"Segoe UI"',
                "Roboto",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-slate-50 min-h-screen relative overflow-x-hidden">
    <!-- Soft blue circles in the background -->
    <div
      class="absolute top-20 left-10 w-72 h-72 bg-blue-100 rounded-full blur-3xl"
    ></div>
    <div
      class="absolute bottom-10 right-10 w-80 h-80 bg-blue-100 rounded-full blur-3xl"
    ></div>

    <!-- This puts the white card in the middle of the screen -->
    <main
      class="relative min-h-screen flex items-center justify-center px-5 py-10"
    >
      <!-- White card (max-w-md controls how wide it can get) -->
      <div class="w-full max-w-md bg-white rounded-xl shadow-sm p-5 md:p-10">
        <!-- Back link: goes back to the code (OTP) page -->
        <a
          href="/AuthenticationSection/resetPassword.html"
          class="inline-block text-xs font-medium text-blue-600"
        >
          ← Back
        </a>

        <!-- Title (on the left) -->
        <h2 class="text-2xl font-semibold text-gray-900 mt-3">
          Create New Password
        </h2>
        <p class="text-xs font-medium text-gray-700 mt-3">
          Your new password must be strong and secure.
        </p>

        <!-- The form. "novalidate" turns off the browser's own popups so our JS messages show instead -->
        <form id="newPasswordForm" class="mt-10" novalidate>
          <!-- New Password -->
          <div>
            <label
              for="newPassword"
              class="block text-sm font-semibold text-gray-900 mb-2"
              >New Password</label
            >
            <div class="relative">
              <input
                type="password"
                id="newPassword"
                placeholder="••••••••••••"
                class="w-full border border-blue-400 rounded-lg py-3 pl-3 pr-10 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              />
              <!-- Eye button to show or hide the password -->
              <button
                type="button"
                id="toggleNewPassword"
                class="absolute right-3 top-1/2 -translate-y-1/2"
              >
                <span id="newEyeOff"
                  ><img
                    src="/icons/famicons_eye-off-sharp.png"
                    alt=""
                    class="w-4 h-4"
                /></span>
                <span id="newEyeOn" class="hidden"
                  ><img src="/icons/eye.png" alt="" class="w-4 h-4"
                /></span>
              </button>
            </div>
            <!-- Error message (hidden until there is a mistake) -->
            <p
              id="newPasswordError"
              class="text-xs font-medium text-red-500 mt-1 hidden"
            ></p>
          </div>

          <!-- Confirm Password -->
          <div class="mt-3">
            <label
              for="confirmPassword"
              class="block text-sm font-semibold text-gray-900 mb-2"
              >Confirm Password</label
            >
            <div class="relative">
              <input
                type="password"
                id="confirmPassword"
                placeholder="••••••••••••"
                class="w-full border border-blue-400 rounded-lg py-3 pl-3 pr-10 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              />
              <button
                type="button"
                id="toggleConfirmPassword"
                class="absolute right-3 top-1/2 -translate-y-1/2"
              >
                <span id="confirmEyeOff"
                  ><img
                    src="/icons/famicons_eye-off-sharp.png"
                    alt=""
                    class="w-4 h-4"
                /></span>
                <span id="confirmEyeOn" class="hidden"
                  ><img src="/icons/eye.png" alt="" class="w-4 h-4"
                /></span>
              </button>
            </div>
            <p
              id="confirmPasswordError"
              class="text-xs font-medium text-red-500 mt-1 hidden"
            ></p>
          </div>

          <!-- Password rules. They start gray and turn green as the user meets each one. -->
          <ul class="space-y-1 mt-3">
            <li id="ruleLength" class="text-xs font-medium text-gray-400">
              ✓ At least 8 characters
            </li>
            <li id="ruleCase" class="text-xs font-medium text-gray-400">
              ✓ Uppercase and lowercase letters
            </li>
            <li id="ruleNumber" class="text-xs font-medium text-gray-400">
              ✓ A number or special character
            </li>
          </ul>

          <!-- Reset Password button -->
          <button
            type="submit"
            class="w-full bg-blue-600 text-white text-sm font-semibold py-3 rounded-lg mt-10 hover:bg-blue-700"
          >
            Reset Password
          </button>
        </form>

        <!-- Back to login link (on the left) -->
        <a
          href="/AuthenticationSection/login.html"
          class="inline-block text-xs font-medium text-blue-600 mt-10"
        >
          Back to login
        </a>
      </div>
    </main>

    <!-- Our JavaScript for this page -->
    <script src="/js/newPassword.js"></script>
  </body>
</html>
