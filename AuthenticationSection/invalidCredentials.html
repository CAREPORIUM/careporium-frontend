<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careporium - Invalid Credentials</title>

    <!-- Tailwind CSS from the CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Use SF Pro (the Apple system font) for the whole page -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                '"SF Pro Text"',
                '"Segoe UI"',
                "Roboto",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-slate-50 min-h-screen relative overflow-x-hidden">
    <!-- Soft blue circles in the background -->
    <div
      class="absolute top-20 left-10 w-72 h-72 bg-blue-100 rounded-full blur-3xl"
    ></div>
    <div
      class="absolute bottom-10 right-10 w-80 h-80 bg-blue-100 rounded-full blur-3xl"
    ></div>

    <!-- This puts the white card in the middle of the screen -->
    <main
      class="relative min-h-screen flex items-center justify-center px-5 py-10"
    >
      <!-- White card (max-w-md controls how wide it can get) -->
      <div class="w-full max-w-md bg-white rounded-xl shadow-sm p-5 md:p-10">
        <!-- Warning icon in a light blue circle -->
        <div
          class="w-14 h-14 rounded-full bg-blue-50 flex items-center justify-center mx-auto"
        >
          <img src="/icons/red-warning.png" alt="" class="w-6 h-6" />
        </div>

        <!-- Title -->
        <h2 class="text-2xl font-semibold text-gray-900 text-center mt-5">
          Invalid Credentials
        </h2>
        <p class="text-xs font-medium text-gray-700 mt-3">
          The email or password you entered is incorrect. Please try again.
        </p>

        <!-- Try Again button (red now): back to the login form -->
        <a
          href="/AuthenticationSection/login.html"
          class="block w-full bg-red-600 text-white text-sm font-semibold text-center py-3 rounded-lg mt-5 hover:bg-red-700"
        >
          Try Again
        </a>

        <!-- Forgot password link -->
        <a
          href="/AuthenticationSection/resetPassword.html"
          class="block text-xs font-medium text-blue-600 text-center mt-3"
        >
          Forgot Password?
        </a>

        <!-- Back to login link -->
        <a
          href="/AuthenticationSection/login.html"
          class="block text-xs font-medium text-blue-600 text-center mt-5"
        >
          Back to login
        </a>
      </div>
    </main>
  </body>
</html>
