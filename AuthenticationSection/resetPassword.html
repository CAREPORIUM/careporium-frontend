<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careporium - Reset Password</title>

    <!-- Tailwind CSS from the CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Use SF Pro (the Apple system font) for the whole page -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                '"SF Pro Text"',
                '"Segoe UI"',
                "Roboto",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-slate-50 min-h-screen relative overflow-x-hidden">
    <!-- Soft blue circles in the background -->
    <div class="absolute top-20 left-10 w-72 h-72 bg-blue-100 rounded-full blur-3xl"></div>
    <div class="absolute bottom-10 right-10 w-80 h-80 bg-blue-100 rounded-full blur-3xl"></div>

    <!-- This puts the white card in the middle of the screen -->
    <main class="relative min-h-screen flex items-center justify-center px-5 py-10">
      <!-- White card (max-w-md controls how wide it can get) -->
      <div class="w-full max-w-md bg-white rounded-xl shadow-sm p-5 md:p-10">
        <!-- Back link: history.back() takes the user to the page they came from -->
        <button type="button" onclick="history.back()" class="text-xs font-medium text-blue-600">
          ← Back
        </button>

        <!-- Title (on the left, no logo in the new design) -->
        <h2 class="text-2xl font-semibold text-gray-900 mt-1">Reset Password</h2>
        <p class="text-sm font-medium text-gray-700 mt-1">
          Enter the OTP sent to your email and phone number.
        </p>

        <!-- The form. "novalidate" turns off the browser's own popups so our JS messages show instead -->
        <form id="otpForm" class="mt-5" novalidate>
          <!-- 6 boxes in a grid of 6 equal columns, so together they fill the card's width. -->
          <!-- They all share the class "otp-box" so JS can find them. -->
          <!-- inputmode="numeric" opens the number keyboard on phones -->
          <div class="grid grid-cols-6 gap-2">
            <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-full h-14 border border-gray-300 rounded-lg text-center text-lg font-semibold text-gray-900 focus:outline-none focus:border-blue-600" />
            <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-full h-14 border border-gray-300 rounded-lg text-center text-lg font-semibold text-gray-900 focus:outline-none focus:border-blue-600" />
            <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-full h-14 border border-gray-300 rounded-lg text-center text-lg font-semibold text-gray-900 focus:outline-none focus:border-blue-600" />
            <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-full h-14 border border-gray-300 rounded-lg text-center text-lg font-semibold text-gray-900 focus:outline-none focus:border-blue-600" />
            <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-full h-14 border border-gray-300 rounded-lg text-center text-lg font-semibold text-gray-900 focus:outline-none focus:border-blue-600" />
            <input type="text" inputmode="numeric" maxlength="1" class="otp-box w-full h-14 border border-gray-300 rounded-lg text-center text-lg font-semibold text-gray-900 focus:outline-none focus:border-blue-600" />
          </div>

          <!-- Error message (hidden until there is a mistake) -->
          <p id="otpError" class="text-xs font-medium text-red-500 mt-2 hidden"></p>

          <!-- Resend with a countdown (all blue, on the left) -->
          <p class="text-xs font-medium text-blue-600 mt-3">
            Didn't receive the code?
            <button type="button" id="resendButton" class="font-medium text-blue-600" disabled>
              Resend (<span id="timer">00:30</span>)
            </button>
          </p>

          <!-- Verify button -->
          <button type="submit" class="w-full bg-blue-600 text-white text-sm font-semibold py-3 rounded-lg mt-5 hover:bg-blue-700">
            Verify
          </button>
        </form>

        <!-- Back to login link (on the left) -->
        <a href="/AuthenticationSection/login.html" class="inline-block text-xs font-medium text-blue-600 mt-5">
          Back to login
        </a>
      </div>
    </main>

    <!-- Our JavaScript for this page -->
    <script src="/js/resetPassword.js"></script>
  </body>
</html>
