<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careporium - Bank Details</title>

    <!-- Tailwind CSS from the CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Use SF Pro (the Apple system font) for the whole page -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                '"SF Pro Text"',
                '"Segoe UI"',
                "Roboto",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
  </head>

  <!-- data-page tells WorkerDashboard.js which page this is, so it loads the right data -->
  <!-- data-requires-verification: until the account is verified, this page sends the user back to the dashboard -->
  <body class="bg-slate-50 text-gray-900" data-requires-verification="../WorkerShiftMarket/Dashboard.html">
    <!-- Sidebar on the left, page on the right -->
    <div class="flex min-h-screen">
      <!-- ==================== SIDEBAR ==================== -->
      <!-- Mobile: hidden until the menu button opens it, then it covers the left of the screen (fixed).
           Desktop (md:): always visible, and sticky + h-screen keeps it in place while the page scrolls. -->
      <aside
        id="sidebar"
        class="flex hidden md:flex flex-col fixed md:sticky inset-y-0 md:top-0 left-0 z-20 w-72 md:w-56 h-screen overflow-y-auto flex-shrink-0 bg-white border-r border-gray-200 p-5"
      >
        <!-- Logo, with a close button next to it (the close button only shows on mobile).
             gap-5 and the wider mobile sidebar (w-72) keep the button away from the logo. -->
        <div class="flex items-center justify-between gap-5">
          <img src="../images/logo-blue.png" alt="Careporium logo" class="w-36 h-auto" />
          <button type="button" id="closeMenuButton" class="md:hidden p-2 rounded-lg hover:bg-gray-100">
            <img src="../icons/close.png" alt="Close menu" class="w-6 h-6" />
          </button>
        </div>

        <!-- Menu links -->
        <nav class="space-y-2 mt-10">
          <a href="../WorkerShiftMarket/Dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 text-sm font-medium hover:bg-gray-50">
            <img src="../icons/nav-dashboard.png" alt="" class="w-4 h-4" />
            Dashboard
          </a>
          <a href="../WorkerShiftMarket/FindShifts.html" data-needs-verification class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 text-sm font-medium hover:bg-gray-50">
            <img src="../icons/nav-find-shifts.png" alt="" class="w-4 h-4" />
            Find shifts
          </a>
          <a href="../WorkerShiftMarket/MyApplications.html" data-needs-verification class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 text-sm font-medium hover:bg-gray-50">
            <img src="../icons/nav-applications.png" alt="" class="w-4 h-4" />
            My applications
          </a>
          <a href="../WorkerShiftMarket/UpcomingShifts.html" data-needs-verification class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 text-sm font-medium hover:bg-gray-50">
            <img src="../icons/nav-upcoming.png" alt="" class="w-4 h-4" />
            Upcoming shifts
          </a>
          <a href="../WorkerShiftMarket/Profile.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 text-sm font-medium hover:bg-gray-50">
            <img src="../icons/nav-profile.png" alt="" class="w-4 h-4" />
            Profile
          </a>
          <!-- Active page: light blue -->
          <a href="../WorkerShiftMarket/Payments.html" data-needs-verification class="flex items-center gap-3 px-3 py-2 rounded-lg bg-blue-50 text-blue-600 text-sm font-medium">
            <img src="../icons/nav-payments.png" alt="" class="w-4 h-4" />
            Payments
          </a>
          <a href="../WorkerShiftMarket/Notifications.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 text-sm font-medium hover:bg-gray-50">
            <img src="../icons/bell.png" alt="" class="w-4 h-4" />
            Notifications
          </a>
        </nav>

        <!-- Log out: outside the <nav>, so mt-auto can push it to the bottom-left of the sidebar -->
        <button
          type="button"
          id="logoutButton"
          data-login="../AuthenticationSection/login.html"
          class="mt-auto w-full flex items-center gap-3 px-3 py-2 rounded-lg border border-red-600 text-red-600 text-sm font-medium hover:bg-red-50"
        >
          <img src="../icons/logout.png" alt="" class="w-4 h-4" />
          Log out
        </button>
      </aside>

      <!-- ==================== RIGHT SIDE ==================== -->
      <div class="flex-1 min-w-0">
        <!-- Top bar. sticky top-0 keeps it at the top while the page scrolls under it. -->
        <header class="sticky top-0 z-10 bg-white border-b border-gray-200 px-5 md:px-8 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <!-- Menu button (only on mobile) -->
            <button type="button" id="menuButton" class="md:hidden">
              <img src="../icons/menu.png" alt="Open menu" class="w-6 h-6" />
            </button>
            <span></span>
          </div>

          <div class="flex items-center gap-3">
            <!-- The bell opens the Notifications page -->
            <a href="../WorkerShiftMarket/Notifications.html" class="p-1 rounded-lg hover:bg-gray-100"><img src="../icons/bell.png" alt="Notifications" class="w-4 h-4" /></a>
            <p class="hidden sm:block text-sm font-medium" data-user-name></p>
            <!-- Initials in a light blue circle -->
            <span class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 text-xs font-semibold flex items-center justify-center" data-user-initials></span>
          </div>
        </header>

        <!-- ==================== PAGE CONTENT ==================== -->
        <main class="p-5 md:p-8 max-w-6xl">
          <!-- Errors that don't belong to one input (e.g. "Can't reach the server") show here -->
          <p id="formError" class="hidden bg-red-50 text-red-600 text-xs font-medium rounded-lg p-3 mb-5"></p>

          <h1 class="text-3xl font-semibold">Bank details</h1>
          <section class="bg-blue-50 border border-blue-100 rounded-2xl p-6 mt-5">
            <h2 class="text-sm font-semibold text-blue-600">Payments go straight to your bank</h2>
            <p class="text-xs text-gray-700 mt-2">Use an account in your name. Changes apply to future payments.</p>
          </section>

          <!-- The form. "novalidate" turns off the browser's own popups so our JS messages show instead -->
          <form id="bankForm" class="bg-white border border-gray-200 rounded-2xl p-6 mt-5" novalidate>
            <div class="space-y-5">
              <div>
                <label for="bankName" class="block text-sm font-semibold mb-2">Bank</label>
                <div class="relative">
                  <select id="bankName" class="w-full appearance-none bg-white border border-gray-200 rounded-lg py-3 pl-3 pr-10 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-200"><option>Access Bank</option><option>First Bank</option><option>GTBank</option><option>Kuda</option><option>Moniepoint</option><option>Opay</option><option>Stanbic IBTC</option><option>UBA</option><option>Wema Bank</option><option>Zenith Bank</option></select>
                  <img src="../icons/akar-icons_chevron-down-small.png" alt="" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none" />
                </div>
              </div>
              <div>
                <label for="accountNumber" class="block text-sm font-semibold mb-2">Account number</label>
                <!-- The placeholder shows the last 4 digits of the account saved now -->
                <input type="text" id="accountNumber" inputmode="numeric" maxlength="10" placeholder="••••••4821" class="w-full border border-gray-200 rounded-lg py-3 px-3 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-200" />
                <p id="accountNumberError" class="text-xs font-medium text-red-500 mt-1 hidden"></p>
              </div>
              <div>
                <label for="accountName" class="block text-sm font-semibold mb-2">Account name</label>
                <input type="text" id="accountName" value="Amara Okafor" class="w-full border border-gray-200 rounded-lg py-3 px-3 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-200" />
                <p id="accountNameError" class="text-xs font-medium text-red-500 mt-1 hidden"></p>
              </div>
            </div>
            <p class="text-xs text-gray-700 mt-3">Account name must match your verified profile.</p>
            <div class="flex flex-wrap justify-between gap-3 mt-5">
              <a href="../WorkerShiftMarket/Payments.html" class="w-40 border border-blue-600 text-blue-600 text-sm font-medium text-center py-3 rounded-lg hover:bg-blue-50">Cancel</a>
              <button type="submit" class="bg-blue-600 text-white text-sm font-medium text-center py-3 rounded-lg hover:bg-blue-700 px-8">Save bank details</button>
            </div>
          </form>
        </main>
      </div>
    </div>

    <!-- api.js must come first: the page script uses its settings and helpers -->
    <script src="../js/api.js"></script>
    <!-- backend.js translates between the pages and the backend's field names -->
    <script src="../js/backend.js"></script>
    <script src="../js/WorkerDashboard.js"></script>
    <script src="../js/workerPayments.js"></script>
  </body>
</html>
