<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careporium - Verification Status</title>

    <!-- Tailwind CSS from the CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Use SF Pro (the Apple system font) for the whole page -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                '"SF Pro Text"',
                '"Segoe UI"',
                "Roboto",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-slate-50 min-h-screen text-gray-900">
    <!-- Full width with space on the sides, like the registration pages -->
    <div class="px-5 md:px-20 py-8">
      <!-- Logo at the top left -->
      <img src="/images/logo-blue.png" alt="Careporium logo" class="w-48 md:w-48 h-auto" />

      <!-- Page heading -->
      <p class="text-xs font-medium text-blue-600 uppercase mt-8">Credential status</p>
      <h1 class="text-lg font-medium mt-1">Your verification progress</h1>

      <!-- ==================== STATUS CARD ==================== -->
      <!-- Everything with an id below is changed by the JS, depending on the status -->
      <div class="max-w-4xl mx-auto bg-white border border-gray-200 rounded-xl overflow-hidden flex flex-col md:flex-row md:min-h-[34rem] mt-10">

        <!-- LEFT: colored panel with the icon and a small label -->
        <div id="statusPanel" class="md:w-72 flex-shrink-0 flex flex-col items-center justify-center py-10 bg-amber-50">
          <!-- Icon in a white circle -->
          <div class="w-24 h-24 rounded-full bg-white flex items-center justify-center">
            <img id="statusIcon" src="/icons/status-pending.png" alt="" class="w-10 h-10" />
          </div>
          <p id="statusLabel" class="text-xs font-semibold uppercase mt-5 text-amber-700">In review</p>
        </div>

        <!-- RIGHT: title, message, info box and button -->
        <div class="flex-1 p-5 md:p-14">
          <h2 id="statusTitle" class="text-3xl font-semibold">Pending Review</h2>
          <p id="statusMessage" class="text-sm text-gray-700 mt-5 max-w-md">
            Your profile and documents are under review. This usually takes 1–3 business days.
          </p>

          <!-- Light blue info box -->
          <div class="bg-blue-50 rounded-lg p-3 pb-8 mt-3">
            <p id="infoTitle" class="text-sm font-semibold">Our verification team is checking your submitted credentials.</p>
            <p id="infoText" class="text-xs text-gray-700 mt-1">Expected review time · 1–3 business days</p>
          </div>

          <!-- Button (its color, text and link change with the status) -->
          <button type="button" id="statusButton" class="w-full md:w-1/2 text-sm font-medium py-3 rounded-lg mt-3 bg-amber-700 text-white hover:bg-amber-800">
            View details
          </button>
        </div>
      </div>
    </div>

    <!-- Our JavaScript for this page -->
    <script src="/js/verificationStatus.js"></script>
  </body>
</html>
