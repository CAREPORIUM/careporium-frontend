<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careporium - Log In</title>

    <!-- Tailwind CSS from the CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Use SF Pro (the Apple system font) for the whole page -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                '"SF Pro Text"',
                '"Segoe UI"',
                "Roboto",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-slate-50 min-h-screen relative overflow-x-hidden">
    <!-- Soft blue circles in the background -->
    <div
      class="absolute top-20 left-10 w-72 h-72 bg-blue-100 rounded-full blur-3xl"
    ></div>
    <div
      class="absolute bottom-10 right-10 w-80 h-80 bg-blue-100 rounded-full blur-3xl"
    ></div>

    <!-- This puts the white card in the middle of the screen -->
    <main
      class="relative min-h-screen flex items-center justify-center px-5 py-10"
    >
      <!-- White card (max-w-md controls how wide it can get) -->
      <div class="w-full max-w-md bg-white rounded-xl shadow-sm p-5 md:p-10">
        <!-- Title (no logo on this page in the new design) -->
        <h2 class="text-2xl font-semibold text-gray-900 text-center">
          Welcome Back
        </h2>
        <p class="text-xs font-medium text-gray-700 text-center mt-3">
          Log in to your Careporium account.
        </p>

        <!-- The form. "novalidate" turns off the browser's own popups so our JS messages show instead -->
        <form id="loginForm" class="space-y-5 mt-5" novalidate>
          <!-- Email Address (with an @ sign inside the box) -->
          <div>
            <label
              for="email"
              class="block text-sm font-semibold text-gray-900 mb-2"
              >Email Address</label
            >
            <div class="relative">
              <span
                class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-500"
                >@</span
              >
              <input
                type="email"
                id="email"
                placeholder="you@gmail.com"
                class="w-full border border-blue-400 rounded-lg py-3 pl-8 pr-3 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              />
            </div>
            <!-- Error message (hidden until there is a mistake) -->
            <p
              id="emailError"
              class="text-xs font-medium text-red-500 mt-1 hidden"
            ></p>
          </div>

          <!-- Password -->
          <div>
            <label
              for="password"
              class="block text-sm font-semibold text-gray-900 mb-2"
              >Password</label
            >
            <div class="relative">
              <input
                type="password"
                id="password"
                placeholder="••••••••••••"
                class="w-full border border-blue-400 rounded-lg py-3 pl-3 pr-10 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              />
              <!-- Eye button to show or hide the password -->
              <button
                type="button"
                id="togglePassword"
                class="absolute right-3 top-1/2 -translate-y-1/2"
              >
                <span id="passwordEyeOff"
                  ><img
                    src="/icons/famicons_eye-off-sharp.png"
                    alt=""
                    class="w-4 h-4"
                /></span>
                <span id="passwordEyeOn" class="hidden"
                  ><img
                    src="/icons/famicons_eye-solid.png"
                    alt=""
                    class="w-4 h-4"
                /></span>
              </button>
            </div>
            <p
              id="passwordError"
              class="text-xs font-medium text-red-500 mt-1 hidden"
            ></p>

            <!-- Forgot password link, on the right -->
            <div class="text-right mt-1">
              <a
                href="/AuthenticationSection/resetPassword.html"
                class="text-xs font-medium text-blue-600"
              >
                Forgot Password?
              </a>
            </div>
          </div>

          <!-- Log in button -->
          <button
            type="submit"
            class="w-full bg-blue-600 text-white text-sm font-semibold py-3 rounded-lg hover:bg-blue-700"
          >
            Log in
          </button>
        </form>

        <!-- "Or continue with" (plain text now, no lines) -->
        <p class="text-xs font-medium text-gray-700 text-center mt-5">
          Or continue with
        </p>

        <!-- Social buttons (will work once there is a backend) -->
        <div class="space-y-3 mt-5">
          <button
            type="button"
            class="w-full border border-blue-400 rounded-lg py-3 text-sm font-semibold text-blue-600 hover:bg-blue-50"
          >
            Continue with Apple
          </button>
          <button
            type="button"
            class="w-full border border-blue-400 rounded-lg py-3 text-sm font-semibold text-blue-600 hover:bg-blue-50"
          >
            Continue with Google
          </button>
        </div>

        <!-- Sign up link (all blue) -->
        <a
          href="/OnboardingSection/signUp.html"
          class="block text-xs font-medium text-blue-600 text-center mt-5"
        >
          Don't have an account? Sign up
        </a>
      </div>
    </main>

    <!-- Our JavaScript for this page -->
    <script src="/js/login.js"></script>
  </body>
</html>
